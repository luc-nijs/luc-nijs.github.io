  #pub-app .pb-controls {

  }
  #pub-app .pb-count { margin-left: auto; color: var(--pb-muted); }

  /* ---- the list ---- */
  #pub-list-pane {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: .3rem;
  }
  #pub-app .pb-group {
    position: sticky; top: 0; background: var(--pb-bg);
    font-weight: 600; font-size: .95rem;
    padding: .3rem 0 .2rem; border-bottom: 1px solid var(--pb-line);
    margin: .9rem 0 .35rem; z-index: 2;
  }
  #pub-app .pb-group:first-child { margin-top: 0; }
  #pub-app .pb-group span { font-weight: 400; color: var(--pb-muted); font-size: .8rem; }

  #pub-app .pb-item {
    padding: .34rem .4rem; border-radius: 5px;
    font-size: .87rem; line-height: 1.5;
    border-left: 3px solid transparent;
  }

  #pub-app .pb-item .pb-t { font-weight: 500; }
  #pub-app .pb-item .pb-v { color: var(--pb-muted); font-style: italic; }
  #pub-app .pb-item a { color: var(--pb-accent); text-decoration: none; }
  #pub-app .pb-item a:hover { text-decoration: underline; }
  #pub-app .pb-doi { font-size: .78rem; }
  #pub-app .pb-badge {
    display: inline-block; font-size: .68rem; text-transform: uppercase;
    letter-spacing: .03em; padding: .05rem .3rem; border-radius: 3px;
    background: #1c1c21; color: var(--pb-muted); border: 1px solid var(--pb-line);
    vertical-align: 1px; margin-left: .25rem; white-space: nowrap;
  }

  #pub-app .pb-status {
    flex: 0 0 auto; padding: .3rem .2rem 0; font-size: .78rem; color: var(--pb-muted);
  }
  #pub-app .pb-status.pb-error { color: #e0a0a0; }

  // -------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  let records = [];

  // Role groups in the order they should appear; anything unrecognised
  // falls to the end under its own raw label.
  const ROLE_ORDER = ["first author", "co-author", "editor", "thesis", "other"];
  const ROLE_LABEL = {
    "first author": "First author",
    "co-author":    "Co-author",
    "editor":       "Editor",
    "thesis":       "Theses",
    "other":        "Other"
  };
  const TYPE_ORDER = ["journal article", "book", "book chapter", "conference paper",
                      "editorial", "professional article", "report", "thesis"];
  const TYPE_LABEL = {
    "journal article":      "Journal articles",
    "book":                 "Books",
    "book chapter":         "Book chapters",
    "conference paper":     "Conference papers",
    "editorial":            "Editorials",
    "professional article": "Professional and practitioner articles",
    "report":               "Reports",
    "thesis":               "Theses"
  };
  // A status other than "published" earns a badge and, in role grouping,
  // lifts the entry into the Forthcoming group at the top.
  const PENDING = /^(forthcoming|in preparation|in review|submitted|accepted|invited|in press)$/i;

  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // ----------------------------------------------------------- rendering
  function itemHtml(r) {
    const bits = [];
    const stamp = PENDING.test(r.status) ? r.status : (r.year || "n.d.");
    bits.push('<span class="pb-a">' + esc(r.authors) + "</span> (" + esc(stamp) + "). ");
    bits.push('<span class="pb-t">' + esc(r.title) + "</span>.");
    if (r.venue) bits.push(' <span class="pb-v">' + esc(r.venue) + "</span>.");
    if (r.doi) {
      bits.push(' <a class="pb-doi" href="https://doi.org/' + encodeURI(r.doi) +
                '">doi:' + esc(r.doi) + "</a>");
    } else if (r.url) {
      bits.push(' <a class="pb-doi" href="' + esc(r.url) + '">link</a>');
    }
    if (r.isbn) bits.push(' <span class="pb-doi pb-v">ISBN ' + esc(r.isbn) + "</span>");
    if (PENDING.test(r.status) && r.year) bits.push('<span class="pb-badge">' + esc(r.year) + "</span>");
    return '<div class="pb-item">' + bits.join("") + "</div>";
  }

  function groupsFor(recs, mode) {
    const buckets = new Map();
    const push = (key, r) => {
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(r);
    };

    if (mode === "year") {
      for (const r of recs) push(r.year ? String(r.year) : "Undated / forthcoming", r);
      const keys = [...buckets.keys()].sort((a, b) => {
        if (!/^\d/.test(a)) return -1;
        if (!/^\d/.test(b)) return 1;
        return Number(b) - Number(a);
      });
      return keys.map((k) => [k, buckets.get(k)]);
    }

    if (mode === "type") {
      for (const r of recs) push(r.type || "other", r);
      const keys = [...buckets.keys()].sort(
        (a, b) => (TYPE_ORDER.indexOf(a) + 1 || 99) - (TYPE_ORDER.indexOf(b) + 1 || 99));
      return keys.map((k) => [TYPE_LABEL[k] || k, buckets.get(k)]);
    }

    // role: pending work first, then first author / co-author / editor / ...
    for (const r of recs) push(PENDING.test(r.status) ? "__pending" : (r.role || "other"), r);
    const keys = [...buckets.keys()].sort((a, b) => {
      if (a === "__pending") return -1;
      if (b === "__pending") return 1;
      return (ROLE_ORDER.indexOf(a) + 1 || 99) - (ROLE_ORDER.indexOf(b) + 1 || 99);
    });
    return keys.map((k) => [k === "__pending" ? "Forthcoming and in press"
                                              : (ROLE_LABEL[k] || k), buckets.get(k)]);
  }

  function draw(recs) {
    const mode = $("pb-group").value;
    const html = [];
    for (const [label, items] of groupsFor(recs, mode)) {
      items.sort((a, b) => (Number(b.year || 0) - Number(a.year || 0)) ||
                           String(a.authors).localeCompare(String(b.authors)));
      html.push('<div class="pb-group">' + esc(label) +
                " <span>" + items.length + "</span></div>");
      for (const r of items) html.push(itemHtml(r));
    }
    $("pb-list").innerHTML = html.join("") ||
      '<div class="pb-item pb-v">Nothing matches these filters.</div>';
  }

  // ------------------------------------------------------------ filtering
  function applyFilters() {
    const type = $("pb-type").value, role = $("pb-role").value;
    const from = Number($("pb-from").value), to = Number($("pb-to").value);
    const q = $("pb-q").value.trim().toLowerCase();

    const hit = records.filter((r) => {
      if (type && r.type !== type) return false;
      if (role && r.role !== role) return false;
      const y = Number(r.year);
      // Undated and forthcoming items are never filtered out by the year range.
      if (y && (y < from || y > to)) return false;
      if (q && !r._hay.includes(q)) return false;
      return true;
    });

    const withDoi = hit.filter((r) => r.doi).length;
    $("pb-count").textContent =
      hit.length + " publication" + (hit.length === 1 ? "" : "s") +
      " · " + withDoi + " with DOI";
    draw(hit);
  }

  function buildControls() {
    const types = [...new Set(records.map((r) => r.type).filter(Boolean))]
      .sort((a, b) => (TYPE_ORDER.indexOf(a) + 1 || 99) - (TYPE_ORDER.indexOf(b) + 1 || 99));
    for (const t of types) {
      $("pb-type").insertAdjacentHTML("beforeend",
        '<option value="' + esc(t) + '">' + esc(TYPE_LABEL[t] || t) + "</option>");
    }
    const roles = [...new Set(records.map((r) => r.role).filter(Boolean))]
      .sort((a, b) => (ROLE_ORDER.indexOf(a) + 1 || 99) - (ROLE_ORDER.indexOf(b) + 1 || 99));
    for (const t of roles) {
      $("pb-role").insertAdjacentHTML("beforeend",
        '<option value="' + esc(t) + '">' + esc(ROLE_LABEL[t] || t) + "</option>");
    }
    const years = records.map((r) => Number(r.year)).filter((y) => y > 1900);
    const lo = Math.min(...years), hi = Math.max(...years);
    for (let y = hi; y >= lo; y--) {
      $("pb-from").insertAdjacentHTML("beforeend", '<option value="' + y + '">' + y + "</option>");
      $("pb-to").insertAdjacentHTML("beforeend", '<option value="' + y + '">' + y + "</option>");
    }
    $("pb-from").value = lo; $("pb-to").value = hi;

    for (const id of ["pb-group", "pb-type", "pb-role", "pb-from", "pb-to"]) {
      $(id).addEventListener("change", applyFilters);
    }
    $("pb-q").addEventListener("input", applyFilters);
  }

  // ------------------------------------------------- reading the sheet
  // Minimal RFC-4180 CSV reader: handles quoted fields, escaped "" quotes,
  // and commas or newlines inside quotes. Sheets exports all three.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else { field += c; }
      } else if (c === '"') { inQuotes = true;
      } else if (c === ",")  { row.push(field); field = "";
      } else if (c === "\n") { row.push(field); rows.push(row); row = []; field = "";
      } else if (c !== "\r") { field += c; }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((v) => String(v).trim() !== ""));
  }

  // Headers are matched case-insensitively and by substring, so you can
  // rename a column ("Journal / book", "Co-authors") without touching code.
  const COLUMN_ALIASES = {
    year:    ["year", "date", "published"],
    authors: ["author", "authors", "with"],
    title:   ["title", "publication", "name"],
    venue:   ["venue", "journal", "book", "source", "outlet", "in"],
    type:    ["type", "kind", "category", "genre"],
    role:    ["role", "position", "authorship"],
    status:  ["status", "stage", "state"],
    doi:     ["doi"],
    url:     ["url", "link", "website"],
    isbn:    ["isbn"],
    language:["language", "lang", "taal"],
    publish: ["publish", "show", "visible"]
  };

  function mapHeaders(header) {
    const lower = header.map((h) => String(h || "").trim().toLowerCase());
    const idx = {};
    for (const [key, aliases] of Object.entries(COLUMN_ALIASES)) {
      for (const alias of aliases) {
        const at = lower.findIndex((h) => h === alias || h.includes(alias));
        if (at !== -1) { idx[key] = at; break; }
      }
    }
    return idx;
  }

  function recordsFromCSV(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) return [];
    const idx = mapHeaders(rows[0]);
    const out = [];
    for (const r of rows.slice(1)) {
      const get = (k) => (idx[k] === undefined ? "" : String(r[idx[k]] ?? "").trim());
      // Only an explicit no hides a row, so an empty Publish column is harmless.
      if (/^(n|no|false|0|hide)$/i.test(get("publish"))) continue;
      const rec = {};
      for (const k of ["authors", "title", "venue", "type", "role", "status",
                       "doi", "url", "isbn", "language"]) {
        // Collapse stray line breaks pasted into a cell, so one Enter in the
        // sheet cannot break the list layout.
        if (get(k)) rec[k] = get(k).replace(/\s+/g, " ").trim();
      }
      rec.title = rec.title || "(untitled)";
      rec.status = (rec.status || "published").toLowerCase();
      rec.type = (rec.type || "").toLowerCase();
      rec.role = (rec.role || "").toLowerCase();
      // A DOI typed as a full URL still works.
      if (rec.doi) rec.doi = rec.doi.replace(/^\s*(https?:\/\/)?(dx\.)?doi\.org\//i, "");
      const ym = /(\d{4})/.exec(get("year"));
      rec.year = ym ? ym[1] : "";
      out.push(rec);
    }
    return out;
  }

  // -------------------------------------------------------------------- go
  function start(list, note) {
    records = list.map((r) => {
      const rec = Object.assign({ status: "published" }, r);
      rec._hay = [rec.authors, rec.title, rec.venue, rec.type, rec.role,
                  rec.status, rec.year, rec.language, rec.doi]
                 .filter(Boolean).join(" ").toLowerCase();
      return rec;
    });
    if (!records.length) { $("pb-status").textContent = "No publications found."; return; }
    buildControls();
    applyFilters();
    $("pb-status").textContent = note;
  }

  if (/^https:\/\//.test(SHEET_CSV_URL)) {
    // Cache-bust per minute so a sheet edit is not masked by a stale copy.
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") +
                "v=" + Math.floor(Date.now() / 60000);
    fetch(url, { cache: "no-cache" })
      .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
      .then((text) => {
        const fromSheet = recordsFromCSV(text);
        if (!fromSheet.length) throw new Error("no usable rows");
        start(fromSheet, "Use the filters above, or search by author, title or journal.");
      })
      .catch(() => {
        // Sheet unreachable or unusable: show the snapshot rather than nothing.
        start(PUBLICATIONS, "Showing the built-in list \u2014 the live sheet could not be read.");
      });
  } else {
    start(PUBLICATIONS, "Use the filters above, or search by author, title or journal.");
  }
})();
</script>
</body>
</html>
