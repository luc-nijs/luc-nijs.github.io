<style>
  html, body { height: 100%; margin: 0; padding: 0; }

  #lecture-map-app {
    --lm-ink:    #d2d1cc;
    --lm-muted:  #a3a2a8;
    --lm-line:   #2e2e35;
    --lm-bg:     #131316;
    --lm-accent: #8fb6dc;
    font-family: Inter, sans-serif;
    color: var(--lm-ink);
    height: 100%; min-height: 320px;
    display: flex; flex-direction: column;
    box-sizing: border-box; padding: .5rem;
  }

  /* ---- shared control bar ---- */
  #lecture-map-app .lm-controls {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; gap: .4rem .9rem;
    align-items: center; margin-bottom: .45rem; font-size: .85rem;
  }
  #lecture-map-app .lm-controls label { color: var(--lm-muted); margin-right: .3rem; }
  #lecture-map-app select,
  #lecture-map-app input[type="search"] {
    font: inherit; padding: .25rem .45rem;
    border: 1px solid var(--lm-line); border-radius: 5px; background: var(--lm-bg);
  }
  #lecture-map-app .lm-count { margin-left: auto; color: var(--lm-muted); }

  /* ---- map beside list on wide frames, stacked on narrow ---- */
  #lecture-map-app .lm-split {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: .6rem;
  }
  #lecture-map {
    flex: 1 1 58%; min-width: 0; min-height: 180px;
    border: 1px solid var(--lm-line); border-radius: 8px;
    background: #1c1c21;
  }
  #lm-list-pane {
    flex: 1 1 42%; min-width: 0; min-height: 0;
    overflow-y: auto; padding-right: .2rem;
  }
  @media (max-width: 760px) {
    #lecture-map-app .lm-split { flex-direction: column; }
    #lecture-map   { flex: 0 0 55%; }
    #lm-list-pane  { flex: 1 1 auto; }
  }

  /* ---- the list ---- */
  #lecture-map-app .lm-year {
    position: sticky; top: 0; background: var(--lm-bg);
    font-weight: 600; font-size: .95rem;
    padding: .3rem 0 .2rem; border-bottom: 1px solid var(--lm-line);
    margin: .5rem 0 .3rem; z-index: 2;
  }
  #lecture-map-app .lm-year:first-child { margin-top: 0; }
  #lecture-map-app .lm-year span { font-weight: 400; color: var(--lm-muted); font-size: .8rem; }

  #lecture-map-app .lm-item {
    padding: .32rem .4rem; border-radius: 5px; cursor: pointer;
    font-size: .85rem; line-height: 1.4;
    border-left: 3px solid transparent;
  }
  #lecture-map-app .lm-item:hover   { background: #1c1c21; }
  #lecture-map-app .lm-item.lm-on   { background: #232329; border-left-color: var(--lm-accent); }
  #lecture-map-app .lm-item .lm-t   { font-weight: 500; }
  #lecture-map-app .lm-item .lm-m   { color: var(--lm-muted); font-size: .78rem; }
  #lecture-map-app .lm-item a       { color: var(--lm-accent); }
  #lecture-map-app .lm-online {
    color: var(--lm-muted); vertical-align: -1px; margin-left: .1rem; opacity: .8;
  }
  #lecture-map-app .lm-dot {
    display: inline-block; width: .55rem; height: .55rem; border-radius: 50%;
    margin-right: .35rem; vertical-align: baseline;
    border: 1px solid rgba(0,0,0,.3);
  }

  #lecture-map-app .lm-status {
    flex: 0 0 auto; padding: .3rem .2rem 0; font-size: .78rem; color: var(--lm-muted);
  }
  #lecture-map-app .lm-status.lm-error { color: #e0a0a0; }

  /* popup + legend */
  #lecture-map-app .lm-pop { font-size: .85rem; line-height: 1.45; max-width: 16rem; }
  #lecture-map-app .lm-pop h4 { margin: 0 0 .2rem; font-size: .9rem; }
  #lecture-map-app .lm-pop .lm-place { color: var(--lm-muted); }
  #lecture-map-app .lm-pop ul { margin: .35rem 0 0; padding-left: 1.05rem; }
  #lecture-map-app .lm-pop li { margin-bottom: .3rem; }
  #lecture-map-app .lm-legend {
    background: rgba(28,28,33,.92); color: #d2d1cc; padding: .4rem .55rem;
    border-radius: 6px; font-size: .75rem; line-height: 1.55;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  #lecture-map-app .lm-legend i {
    display: inline-block; width: .65rem; height: .65rem; border-radius: 50%;
    margin-right: .35rem; vertical-align: middle; border: 1px solid rgba(0,0,0,.35);
  }
</style>

</div>

  }).addTo(map);

  const mapEl = $("lecture-map");
  if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe(mapEl);
  window.addEventListener("load",   () => map.invalidateSize());
  window.addEventListener("resize", () => map.invalidateSize());
  setTimeout(() => map.invalidateSize(), 300);

  // ----------------------------------------------------------------- state
  let records = [];
  const markerByKey = new Map();     // "lat,lon" -> marker, for list -> map

  const placed = (r) => Number.isFinite(r.lat) && Number.isFinite(r.lon);
  const coordKey = (r) => placed(r) ? r.lat.toFixed(4) + "," + r.lon.toFixed(4) : null;

  // ------------------------------------------------------------- rendering
  function popupHtml(items) {
    const sorted = items.slice().sort((a, b) => (yearOf(b) || 0) - (yearOf(a) || 0));
    const head = sorted[0];
    const lis = sorted.map((r) => {
      const t = r.url ? `<a href="${esc(r.url)}">${esc(r.title)}</a>` : esc(r.title);
      const meta = [prettyDate(r), r.occasion, r.kind].filter(Boolean).map(esc).join(" &middot; ");
      const people = r.people ? `<br><span class="lm-place">with ${esc(r.people)}</span>` : "";
      return `<li>${t}${onlineMark(r)}${
               meta ? `<br><span class="lm-place">${meta}</span>` : ""}${people}</li>`;
    }).join("");
    return `<div class="lm-pop"><h4>${esc(head.city || "")}</h4>
            <div class="lm-place">${esc(placeOf(head))}${
              sorted.length > 1 ? ` &middot; ${sorted.length} entries` : ""}</div>
            <ul>${lis}</ul></div>`;
  }

  function drawMap(recs) {
    cluster.clearLayers();
    markerByKey.clear();
    const byKey = new Map();
    for (const r of recs.filter(placed)) {
      const k = coordKey(r);
      if (!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(r);
    }
    for (const [k, items] of byKey) {
      const radius = 6 + Math.min(6, Math.sqrt(items.length - 1) * 3.5);
      const m = L.circleMarker([items[0].lat, items[0].lon], {
        radius, color: "#ffffff", weight: 1.5,
        fillColor: colorFor(items[0].kind), fillOpacity: .85
      })
        .bindPopup(popupHtml(items))
        .bindTooltip(`${items[0].city || ""}${items.length > 1 ? ` (${items.length})` : ""}`,
                     { direction: "top" })
        .addTo(cluster);
      markerByKey.set(k, m);
    }
    return byKey.size;
  }

  function drawList(recs) {
    const pane = $("lm-list");
    if (!recs.length) { pane.innerHTML = '<div class="lm-item">Nothing matches these filters.</div>'; return; }

    const byYear = new Map();
    for (const r of recs) {
      const y = yearOf(r) ?? "—";
      if (!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(r);
    }
    const years = [...byYear.keys()].sort((a, b) => (b === "—" ? -1 : a === "—" ? 1 : b - a));

    const html = years.map((y) => {
      const items = byYear.get(y).slice()
        .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
      const rows = items.map((r) => {
        const idx = records.indexOf(r);
        const t = r.url ? `<a href="${esc(r.url)}">${esc(r.title)}</a>` : esc(r.title);
        const where = placeOf(r);      // blank when unknown; the icon marks "online"
        const meta = [prettyDate(r), where, r.occasion, r.kind]
                       .filter(Boolean).map(esc).join(" &middot; ");
        const people = r.people ? `<br><span class="lm-m">with ${esc(r.people)}</span>` : "";
        return `<div class="lm-item" data-i="${idx}">
                  <span class="lm-dot" style="background:${colorFor(r.kind)}"></span>
                  <span class="lm-t">${t}</span>${onlineMark(r)}<br>
                  <span class="lm-m">${meta}</span>${people}
                </div>`;
      }).join("");
      return `<div class="lm-year">${esc(String(y))}
                <span>${items.length} ${items.length === 1 ? "entry" : "entries"}</span>
              </div>${rows}`;
    }).join("");

    pane.innerHTML = html;
  }

  // Clicking a list row centres the map on it and opens its popup.
  $("lm-list").addEventListener("click", (ev) => {
    if (ev.target.closest("a")) return;                 // let real links work
    const row = ev.target.closest(".lm-item");
    if (!row || !row.dataset.i) return;
    const rec = records[parseInt(row.dataset.i, 10)];
    if (!rec) return;

    for (const el of document.querySelectorAll(".lm-item.lm-on")) el.classList.remove("lm-on");
    row.classList.add("lm-on");

    if (!placed(rec)) return;              // nothing to fly to
    const marker = markerByKey.get(coordKey(rec));
    if (!marker) return;
    map.flyTo([rec.lat, rec.lon], Math.max(map.getZoom(), 6), { duration: .6 });
    // The marker may be inside a collapsed cluster; ask the cluster to reveal it.
    cluster.zoomToShowLayer(marker, () => marker.openPopup());
  });

  function applyFilters(fit) {
    const kind = $("lm-kind").value.toLowerCase();
    const from = parseInt($("lm-from").value, 10);
    const to   = parseInt($("lm-to").value, 10);
    const q    = $("lm-q").value.trim().toLowerCase();

    const out = records.filter((r) => {
      if (kind && String(r.kind || "").toLowerCase() !== kind) return false;
      const y = yearOf(r);
      if (!Number.isNaN(from) && y != null && y < from) return false;
      if (!Number.isNaN(to)   && y != null && y > to)   return false;
      if (q) {
        const hay = [r.title, r.city, r.country, r.kind, r.occasion, r.people,
                     r.online ? "online" : ""].filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const locs = drawMap(out);
    drawList(out);

    const onlineCount = out.filter((r) => r.online).length;
    $("lm-count").textContent =
      `${out.length} lecture${out.length === 1 ? "" : "s"} · ${locs} location${locs === 1 ? "" : "s"}` +
      (onlineCount ? ` · ${onlineCount} online` : "");

    const pts = out.filter(placed).map((r) => [r.lat, r.lon]);
    if (fit && pts.length) {
      map.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: CONFIG.maxFitZoom });
    }
  }

  function buildControls() {
    const kinds = [...new Set(records.map((r) => r.kind).filter(Boolean))].sort();
    for (const k of kinds) {
      const o = document.createElement("option");
      o.value = k; o.textContent = k;
      $("lm-kind").appendChild(o);
    }
    const years = records.map(yearOf).filter((y) => y != null);
    const lo = years.length ? Math.min(...years) : new Date().getFullYear();
    const hi = years.length ? Math.max(...years) : lo;
    for (let y = lo; y <= hi; y++) {
      for (const id of ["lm-from", "lm-to"]) {
        const o = document.createElement("option");
        o.value = y; o.textContent = y;
        $(id).appendChild(o);
      }
    }
    $("lm-from").value = lo;
    $("lm-to").value = hi;

    // The legend lists only the recognised vocabulary. A Type cell holding
    // free text (easy to do by typing in the wrong column) would otherwise
    // mint a legend row as wide as the sentence and sit across the map.
    // Unrecognised values are collapsed into a single "other" row; they are
    // still listed individually in the Type dropdown above, which is where
    // you want to see them, because that is how you spot the mistake.
    const known = Object.keys(CONFIG.colors).filter((k) => k !== "_default");
    const shown = known.filter((k) => kinds.some((v) => v.toLowerCase() === k));
    const hasOther = kinds.some((v) => !known.includes(v.toLowerCase()));

    if (shown.length + (hasOther ? 1 : 0) > 1) {
      const legend = L.control({ position: "bottomright" });
      legend.onAdd = function () {
        const div = L.DomUtil.create("div", "lm-legend");
        const rows = shown.map((k) =>
          `<div><i style="background:${colorFor(k)}"></i>${esc(k)}</div>`);
        if (hasOther) {
          rows.push(`<div><i style="background:${CONFIG.colors._default}"></i>other</div>`);
        }
        div.innerHTML = rows.join("");
        return div;
      };
      legend.addTo(map);
    }

    for (const id of ["lm-kind", "lm-from", "lm-to"]) {
      $(id).addEventListener("change", () => applyFilters(false));
    }
    $("lm-q").addEventListener("input", () => applyFilters(false));
  }

  // ------------------------------------------------------- reading the sheet
  // Minimal RFC-4180 CSV reader: handles quoted fields, escaped "" quotes,
  // and commas or newlines inside quotes. Sheets exports all three.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else { field += c; }
      } else if (c === '"') { inQuotes = true;
      } else if (c === ",")  { row.push(field); field = "";
      } else if (c === "\n") { row.push(field); rows.push(row); row = []; field = "";
      } else if (c !== "\r") { field += c; }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((v) => String(v).trim() !== ""));
  }

  // Column headers are matched loosely, so the Google Form's own question
  // wording ("Which city?", "Type of lecture") still lines up.
  const COLUMN_ALIASES = {
    title:   ["title", "lecture", "talk", "name", "event", "subject"],
    city:    ["city", "town", "place", "location"],
    country: ["country", "nation"],
    date:    ["date", "when", "day"],
    kind:    ["kind", "type", "category", "format"],
    occasion:["occasion", "event", "series", "host", "conference", "organiser", "organizer"],
    online:  ["online", "remote", "virtual", "distance"],
    people:  ["collaborator", "collaborators", "with", "co-author", "coauthors", "authors"],
    url:     ["url", "link", "website"],
    lat:     ["lat", "latitude"],
    lon:     ["lon", "lng", "long", "longitude"]
  };

  function mapHeaders(header) {
    const lower = header.map((h) => String(h || "").trim().toLowerCase());
    const idx = {};
    for (const [key, aliases] of Object.entries(COLUMN_ALIASES)) {
      for (const alias of aliases) {
        const at = lower.findIndex((h) => h === alias || h.includes(alias));
        if (at !== -1) { idx[key] = at; break; }
      }
    }
    return idx;
  }

  function recordsFromCSV(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) return [];
    const idx = mapHeaders(rows[0]);
    const out = [];

    for (const r of rows.slice(1)) {
      const get = (k) => (idx[k] === undefined ? "" : String(r[idx[k]] ?? "").trim());
      // A row with no coordinates is KEPT: it still belongs in the list, it
      // just cannot have a pin. Online lectures are the main case.
      const lat = parseFloat(get("lat").replace(",", "."));
      const lon = parseFloat(get("lon").replace(",", "."));

      // Collapse stray line breaks pasted into a cell, so one Enter in the
      // sheet cannot break the list layout.
      const rec = { lat, lon,
                    title: get("title").replace(/\s+/g, " ").trim() || "(untitled)" };
      for (const k of ["city", "country", "date", "kind", "occasion", "people", "url"]) {
        if (get(k)) rec[k] = get(k);
      }
      // Anything affirmative counts; a blank cell means in person.
      rec.online = /^(y|yes|true|1|x|online|ja|oui|si|wel)$/i.test(get("online"));
      // Normalise a date the Form may have written as DD/MM/YYYY.
      const dm = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(rec.date || "");
      if (dm) rec.date = `${dm[3]}-${dm[2].padStart(2, "0")}-${dm[1].padStart(2, "0")}`;
      out.push(rec);
    }
    return out;
  }

  // -------------------------------------------------------------------- go
  function start(list, note) {
    records = list
      .map((r) => ({ ...r, lat: parseFloat(r.lat), lon: parseFloat(r.lon) }))
      .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));

    if (!records.length) {
      $("lm-status").textContent = "No lectures found.";
      return;
    }
    buildControls();
    applyFilters(true);
    $("lm-status").textContent = note;
  }

  if (/^https:\/\//.test(SHEET_CSV_URL)) {
    // Cache-bust per minute so a sheet edit is not masked by a stale copy.
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") +
                "v=" + Math.floor(Date.now() / 60000);
    fetch(url, { cache: "no-cache" })
      .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
      .then((text) => {
        const fromSheet = recordsFromCSV(text);
        if (!fromSheet.length) throw new Error("no usable rows");
        start(fromSheet, "Click an entry in the list to locate it on the map.");
      })
      .catch(() => {
        // Sheet unreachable or unusable: show the snapshot rather than nothing.
        start(LECTURES, "Showing the built-in list \u2014 the live sheet could not be read.");
      });
  } else {
    start(LECTURES, "Click an entry in the list to locate it on the map.");
  }
})();
</script>
</body>
</html>
